<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI-Powered Inventory Monitor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <h1>AI Inventory Monitor</h1>
        <p>Sign in to manage stock and access Microsoft Foundry AI insights</p>
      </div>

      <div id="authAlert" style="display: none;" class="alert alert-danger" style="margin-bottom: 18px;">
        <span id="authAlertText"></span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="admin or admin@inventory.local" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-cyan" style="width: 100%; margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="demo-credentials-box">
        <i class="fa-solid fa-key" style="color: var(--primary);"></i> <strong>Demo Credentials:</strong><br>
        Admin: <code>admin</code> / <code>admin123</code><br>
        Manager: <code>manager</code> / <code>manager123</code>
      </div>

      <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="{{ url_for('auth.register_page') }}">Register here</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("authAlert");
      const alertText = document.getElementById("authAlertText");
      const submitBtn = document.getElementById("submitBtn");

      alertBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      const payload = {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();
        if (resp.ok && data.success) {
          window.location.href = "/dashboard";
        } else {
          alertText.innerText = data.error || "Login failed. Please check credentials.";
          alertBox.style.display = "flex";
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
        }
      } catch (err) {
        alertText.innerText = "Network error while connecting to server.";
        alertBox.style.display = "flex";
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
