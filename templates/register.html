<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AI-Powered Inventory Monitor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <h1>Create Account</h1>
        <p>Register a new operator or manager account</p>
      </div>

      <div id="authAlert" style="display: none;" class="alert alert-danger" style="margin-bottom: 18px;">
        <span id="authAlertText"></span>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="e.g. jdoe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="e.g. jdoe@inventory.local" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role</label>
          <select id="role" name="role" class="form-control">
            <option value="admin">Administrator (Full Access + AI Insights)</option>
            <option value="manager">Inventory Manager</option>
            <option value="staff">Warehouse Staff</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" minlength="6" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-cyan" style="width: 100%; margin-top: 10px;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('auth.login_page') }}">Sign in here</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("authAlert");
      const alertText = document.getElementById("authAlertText");
      const submitBtn = document.getElementById("submitBtn");

      alertBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registering...';

      const payload = {
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        role: document.getElementById("role").value,
        password: document.getElementById("password").value
      };

      try {
        const resp = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();
        if (resp.ok && data.success) {
          window.location.href = "/dashboard";
        } else {
          alertText.innerText = data.error || "Registration failed.";
          alertBox.style.display = "flex";
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        }
      } catch (err) {
        alertText.innerText = "Network error connecting to server.";
        alertBox.style.display = "flex";
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      }
    });
  </script>
</body>
</html>
